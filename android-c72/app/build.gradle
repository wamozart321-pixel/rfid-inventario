plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.inventario.rfid'
    compileSdk 34
    defaultConfig {
        applicationId "com.inventario.rfid"
        minSdk 21          // C72 trae Android 8/9/11 según versión
        targetSdk 34
        versionCode 15
        versionName "2.4"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    // *** IMPORTANTE: copiar aquí el SDK de Chainway ***
    // app/libs/DeviceAPI_ver20xxxxxx_release.jar  (viene en el CD/descarga de Chainway)
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
